server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;

    location = /webmail-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /health {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://mailcow-rest-api:3001;
        proxy_pass $api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /openapi.json {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://mailcow-rest-api:3001;
        proxy_pass $api_upstream/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /v1/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://mailcow-rest-api:3001;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        client_max_body_size 100m;
    }

    location = /webmail {
        return 308 /webmail/;
    }

    # Hashed build assets: never fall back to index.html. The SPA fallback
    # below would answer a request for a deleted chunk with 200 + HTML, and
    # the service worker caches any ok response under the requested URL —
    # so one post-deploy request for an old chunk poisoned the cache with
    # HTML served as JavaScript ("failed to execute importScripts"). A 404
    # is both honest and uncacheable by that path.
    location ^~ /webmail/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Same reasoning for the tesseract worker + WASM cores.
    location ^~ /webmail/tesseract/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The entry documents and the service worker must never be held by an
    # intermediate cache, or clients keep booting the previous deploy.
    location = /webmail/sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /webmail/mobile/ {
        try_files $uri $uri/ /webmail/mobile/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /webmail/ {
        try_files $uri $uri/ /webmail/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
