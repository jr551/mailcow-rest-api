name: test

on:
  push:
    branches: [master]
  pull_request:

# Public repo: never run on self-hosted home hardware for fork PRs (untrusted code).
permissions:
  actions: read
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Prefer an online self-hosted runner (alexpc / matthewpc when registered).
  # If none are idle/online, fall back to GitHub-hosted so jobs never queue forever.
  resolve-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.pick.outputs.label }}
    steps:
      - id: pick
        uses: actions/github-script@379587d6aa349658548d8df2da05927763b9fcb8 # v7.1.1
        with:
          script: |
            const fork = context.payload.pull_request
              && context.payload.pull_request.head.repo.full_name !== context.repo.full_name;
            if (fork) {
              core.setOutput('label', 'ubuntu-latest');
              return;
            }
            try {
              const { data } = await github.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              const online = (data.runners || []).filter((r) => r.status === 'online');
              const home = online.filter((r) => /^(alexpc|matthewpc)$/i.test(r.name));
              const chosen = home[0] || online[0];
              if (chosen) {
                core.info(`Selected self-hosted runner: ${chosen.name}`);
                core.setOutput('label', chosen.name);
              } else {
                core.info('No online self-hosted runners; falling back to ubuntu-latest');
                core.setOutput('label', 'ubuntu-latest');
              }
            } catch (err) {
              core.warning(`listSelfHostedRunnersForRepo failed (${err.message}); using ubuntu-latest`);
              core.setOutput('label', 'ubuntu-latest');
            }

  unit:
    needs: resolve-runner
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ needs.resolve-runner.outputs.label }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Runner context
        run: |
          echo "requested_label=${{ needs.resolve-runner.outputs.label }}"
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "runner_labels=${RUNNER_LABELS}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      # Transitive vulnerabilities in the mail path (nodemailer, fastify,
      # better-sqlite3, pdf/ocr libs) are the highest-blast-radius class of
      # dependency bug this project can inherit — fail on high/critical.
      - run: npm audit --audit-level=high

  # The image builds the SPA, so a webmail type error or broken build has to
  # fail here rather than at publish time.
  webmail:
    needs: resolve-runner
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ needs.resolve-runner.outputs.label }}
    defaults:
      run:
        shell: bash
        working-directory: webmail
    steps:
      - name: Runner context
        run: |
          echo "requested_label=${{ needs.resolve-runner.outputs.label }}"
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "runner_labels=${RUNNER_LABELS}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webmail/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:unit
      # The webmail tree is the larger dependency surface (tldraw, tiptap,
      # pdfjs, pdf-lib, tesseract) — audit it too.
      - run: npm audit --audit-level=high
