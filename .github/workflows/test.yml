name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      # Transitive vulnerabilities in the mail path (nodemailer, fastify,
      # better-sqlite3, pdf/ocr libs) are the highest-blast-radius class of
      # dependency bug this project can inherit — fail on high/critical.
      - run: npm audit --audit-level=high

  # The image builds the SPA, so a webmail type error or broken build has to
  # fail here rather than at publish time.
  webmail:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webmail
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webmail/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The webmail tree is the larger dependency surface (tldraw, tiptap,
      # pdfjs, pdf-lib, tesseract) — audit it too.
      - run: npm audit --audit-level=high
