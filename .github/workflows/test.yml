name: test

on:
  push:
    branches: [master]
  pull_request:

# Public repo: never run on self-hosted home hardware for fork PRs (untrusted code).
permissions:
  actions: read
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Prefer an online self-hosted runner (alexpc / matthewpc when registered).
  # If none are idle/online, fall back to GitHub-hosted so jobs never queue forever.
  resolve-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.pick.outputs.label }}
    steps:
      - name: Pick runner label
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] \
            && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "label=ubuntu-latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          names="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" \
            --jq '.runners[] | select(.status=="online") | .name' 2>/dev/null || true)"
          chosen=""
          for want in alexpc matthewpc; do
            if echo "$names" | grep -iq "^${want}$"; then
              chosen="$want"
              break
            fi
          done
          if [ -z "$chosen" ] && [ -n "$names" ]; then
            chosen="$(echo "$names" | head -n1)"
          fi
          if [ -n "$chosen" ]; then
            echo "Using self-hosted runner: $chosen"
            echo "label=${chosen}" >> "$GITHUB_OUTPUT"
          else
            echo "No online self-hosted runners; using ubuntu-latest"
            echo "label=ubuntu-latest" >> "$GITHUB_OUTPUT"
          fi

  unit:
    needs: resolve-runner
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ needs.resolve-runner.outputs.label }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Runner context
        run: |
          echo "requested_label=${{ needs.resolve-runner.outputs.label }}"
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "runner_labels=${RUNNER_LABELS}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      # Transitive vulnerabilities in the mail path (nodemailer, fastify,
      # better-sqlite3, pdf/ocr libs) are the highest-blast-radius class of
      # dependency bug this project can inherit — fail on high/critical.
      - run: npm audit --audit-level=high

  # The image builds the SPA, so a webmail type error or broken build has to
  # fail here rather than at publish time.
  webmail:
    needs: resolve-runner
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ needs.resolve-runner.outputs.label }}
    defaults:
      run:
        shell: bash
        working-directory: webmail
    steps:
      - name: Runner context
        run: |
          echo "requested_label=${{ needs.resolve-runner.outputs.label }}"
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "runner_labels=${RUNNER_LABELS}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webmail/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:unit
      # The webmail tree is the larger dependency surface (tldraw, tiptap,
      # pdfjs, pdf-lib, tesseract) — audit it too.
      - run: npm audit --audit-level=high
