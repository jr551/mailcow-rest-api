name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  # The image builds the SPA, so a webmail type error or broken build has to
  # fail here rather than at publish time.
  webmail:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webmail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webmail/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
