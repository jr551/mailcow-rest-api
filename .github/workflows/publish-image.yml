name: publish-image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  # An image is only published from a commit that passes the same checks as
  # a pull request: unit tests, webmail check/build and the dependency audit.
  test:
    uses: ./.github/workflows/test.yml

  resolve-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.pick.outputs.label }}
    steps:
      - name: Pick runner label
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pick_ubuntu() {
            echo "No online self-hosted runners; using ubuntu-latest"
            echo "label=ubuntu-latest" >> "$GITHUB_OUTPUT"
          }
          if ! body="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" 2>&1)"; then
            echo "listSelfHostedRunnersForRepo failed: ${body}"
            pick_ubuntu
            exit 0
          fi
          mapfile -t names < <(echo "$body" | jq -r '.runners[]? | select(.status=="online") | .name')
          chosen=""
          for want in alexpc matthewpc; do
            for n in "${names[@]:-}"; do
              if [ -n "$n" ] && [ "$(echo "$n" | tr '[:upper:]' '[:lower:]')" = "$want" ]; then
                chosen="$n"
                break 2
              fi
            done
          done
          if [ -z "$chosen" ] && [ "${#names[@]}" -gt 0 ] && [ -n "${names[0]}" ]; then
            chosen="${names[0]}"
          fi
          if [ -n "$chosen" ] && [[ "$chosen" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Using self-hosted runner: $chosen"
            echo "label=${chosen}" >> "$GITHUB_OUTPUT"
          else
            pick_ubuntu
          fi

  publish:
    needs: [test, resolve-runner]
    runs-on: ${{ needs.resolve-runner.outputs.label }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Runner context
        run: |
          echo "requested_label=${{ needs.resolve-runner.outputs.label }}"
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "runner_labels=${RUNNER_LABELS}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jr551/mailcow-rest-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
