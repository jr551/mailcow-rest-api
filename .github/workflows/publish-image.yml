name: publish-image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  resolve-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.pick.outputs.label }}
    steps:
      - name: Pick runner label
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          names="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" \
            --jq '.runners[] | select(.status=="online") | .name' 2>/dev/null || true)"
          chosen=""
          for want in alexpc matthewpc; do
            if echo "$names" | grep -iq "^${want}$"; then
              chosen="$want"
              break
            fi
          done
          if [ -z "$chosen" ] && [ -n "$names" ]; then
            chosen="$(echo "$names" | head -n1)"
          fi
          if [ -n "$chosen" ]; then
            echo "Using self-hosted runner: $chosen"
            echo "label=${chosen}" >> "$GITHUB_OUTPUT"
          else
            echo "No online self-hosted runners; using ubuntu-latest"
            echo "label=ubuntu-latest" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.label }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Runner context
        run: |
          echo "requested_label=${{ needs.resolve-runner.outputs.label }}"
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "runner_labels=${RUNNER_LABELS}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jr551/mailcow-rest-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
