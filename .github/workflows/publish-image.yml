name: publish-image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  resolve-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.pick.outputs.label }}
    steps:
      - id: pick
        uses: actions/github-script@379587d6aa349658548d8df2da05927763b9fcb8 # v7.1.1
        with:
          script: |
            try {
              const { data } = await github.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              const online = (data.runners || []).filter((r) => r.status === 'online');
              const home = online.filter((r) => /^(alexpc|matthewpc)$/i.test(r.name));
              const chosen = home[0] || online[0];
              if (chosen) {
                core.info(`Selected self-hosted runner: ${chosen.name}`);
                core.setOutput('label', chosen.name);
              } else {
                core.info('No online self-hosted runners; falling back to ubuntu-latest');
                core.setOutput('label', 'ubuntu-latest');
              }
            } catch (err) {
              core.warning(`listSelfHostedRunnersForRepo failed (${err.message}); using ubuntu-latest`);
              core.setOutput('label', 'ubuntu-latest');
            }

  publish:
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.label }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Runner context
        run: |
          echo "requested_label=${{ needs.resolve-runner.outputs.label }}"
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "runner_labels=${RUNNER_LABELS}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jr551/mailcow-rest-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
