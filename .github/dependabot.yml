version: 2
updates:
  # Root API dependencies (nodemailer, fastify ecosystem, better-sqlite3,
  # pdf/ocr libraries).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  # The webmail SPA is the larger dependency surface (tldraw, tiptap, pdfjs,
  # pdf-lib, tesseract) and is built into the image — keep it covered too.
  - package-ecosystem: npm
    directory: /webmail
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # svelte-check 4 peers on TypeScript 5 or 6. A TypeScript 7 bump
      # makes `npm ci` fail with ERESOLVE; lift this when svelte-check
      # supports 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  # Dockerfile base images (node:*-alpine).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Keep the pinned action SHAs moving.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
