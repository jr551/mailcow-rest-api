version: 2
updates:
  # Root API dependencies (nodemailer, fastify ecosystem, better-sqlite3,
  # pdf/ocr libraries).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  # The webmail SPA is the larger dependency surface (tldraw, tiptap, pdfjs,
  # pdf-lib, tesseract) and is built into the image — keep it covered too.
  - package-ecosystem: npm
    directory: /webmail
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  # Dockerfile base images (node:*-alpine).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Keep the pinned action SHAs moving.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
